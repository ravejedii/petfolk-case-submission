 environment,</text><text x="230.5" y="1101.3" font-size="11.3" fill="#1f2937" text-anchor="middle" dominant-baseline="middle">timed end to end</text><rect x="403.0" y="1052" width="293.0" height="68" rx="8" fill="#fdf0d5" stroke="#c77d10" stroke-width="1.4"/><text x="549.5" y="1070.7" font-size="11.3" fill="#1f2937" text-anchor="middle" dominant-baseline="middle">Doc-consistency pass</text><text x="549.5" y="1086.0" font-size="11.3" fill="#1f2937" text-anchor="middle" dominant-baseline="middle">every doc checked</text><text x="549.5" y="1101.3" font-size="11.3" fill="#1f2937" text-anchor="middle" dominant-baseline="middle">against the code</text><line x1="377.0" y1="1086.0" x2="403.0" y2="1086.0" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/><line x1="440.0" y1="1134" x2="440.0" y2="1156" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/><rect x="270.0" y="1156" width="340" height="54" rx="8" fill="#efeafc" stroke="#6d3fd1" stroke-width="1.4"/><text x="440.0" y="1183.0" font-size="12.5" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-weight="600">Evidence report → human review</text><rect x="70" y="1236" width="640" height="96" rx="10" fill="#fdeaea" stroke="#d03c3c" stroke-width="1.4" stroke-dasharray="6 4"/><text x="84" y="1256.0" font-size="13" fill="#991b1b" text-anchor="start" dominant-baseline="middle" font-weight="600">At every gate — the fix loop</text><rect x="84" y="1272" width="135.0" height="42" rx="8" fill="#ffffff" stroke="#d03c3c" stroke-width="1.4"/><text x="151.5" y="1293.0" font-size="11.3" fill="#1f2937" text-anchor="middle" dominant-baseline="middle">verifier says FAIL</text><line x1="219.0" y1="1293" x2="243.0" y2="1293" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/><rect x="243.0" y="1272" width="135.0" height="42" rx="8" fill="#ffffff" stroke="#d03c3c" stroke-width="1.4"/><text x="310.5" y="1293.0" font-size="11.3" fill="#1f2937" text-anchor="middle" dominant-baseline="middle">fixer ag